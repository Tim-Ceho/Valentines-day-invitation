<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head> 
    <body>
        <div class="container">
            <div >
                <h1 class = "header_text">Would you like to be my Valentine?</h1>
                <h1 class = "header_text"></h1>
            </div>
            <div class="gif_container">
                <img src="https://media.tenor.com/-fxSxMDttpcAAAAi/anime-love.gif" alt="Cute animated illustration">
            </div>
            <div class = "buttons">
                <button class="btn" id = "yesButton" onclick="nextPage()">Yes</button>
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }

                    let shrinkingBorder = 1; 
                    let yesScale = 1; 

                    function moveButton() {
    const btn = document.getElementById('noButton');
    const yesBtn = document.getElementById('yesButton');

    // 1. Grow the Yes Button 
    // We REMOVE the .style.left, .top, and .position changes for yesBtn
    if (yesScale < 10) {
        yesScale += 0.5;
    }
    
    // Only change the scale. It stays in its vertical "sandwich" spot.
    yesBtn.style.transform = `scale(${yesScale})`;

    // 2. Prepare the No Button
    // This stays 'fixed' so it can fly anywhere on the screen
    btn.style.position = 'fixed'; 
    btn.style.transform = "none"; 

    // 3. Shrink the multiplier (your existing math)
    if (shrinkingBorder > 0.1) {
        shrinkingBorder -= 0.05; 
    }

    // 4. Screen dimensions for the No button
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;
    const centerX = windowW / 2;
    const centerY = windowH / 2;

    // 5. Calculate range and random position (your existing math)
    const rangeX = Math.floor((windowW - btn.offsetWidth) * shrinkingBorder);
    const rangeY = Math.floor((windowH - btn.offsetHeight) * shrinkingBorder);

    const randomX = Math.floor((centerX - (rangeX / 2)) + (Math.random() * (rangeX - btn.offsetWidth)));
    const randomY = Math.floor((centerY - (rangeY / 2)) + (Math.random() * (rangeY - btn.offsetHeight)));

    // 6. Apply coordinates to No button ONLY
    btn.style.left = randomX + "px";
    btn.style.top = randomY + "px";
}

                </script> 
            </div>
        </div>
       
    </body> 
</html>
